# MexiVerse Android app (APK) építése a GitHub ingyenes szerverein.
# Az app a https://mexiverse.up.railway.app oldalt tölti be, így a játék frissítéseihez nem kell új APK.
# Kész APK: public/app/MexiVerse.apk (a játék oldaláról letölthető) + a futás „artifact”-jai között.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [mexiverse]
    paths: ['android/**', 'capacitor.config.json', 'app-shell/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency: { group: android-apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      # Ugyanaz az aláíró kulcs minden építésnél, hogy az app frissíthető legyen (nem kell törölni)
      - uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: mexiverse-debug-keystore-v1 }
      - run: npm ci
      - run: npx cap sync android
      - name: APK építése
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with: { name: MexiVerse-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: APK a letöltési ágra (nem indít új Railway-telepítést)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          mkdir out && cp android/app/build/outputs/apk/debug/app-debug.apk out/MexiVerse.apk && cd out
          git init -q -b mexiverse-apk
          git config user.name "mexiverse-bot"; git config user.email "mexiverse-bot@users.noreply.github.com"
          git add MexiVerse.apk && git commit -qm "MexiVerse APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:mexiverse-apk
