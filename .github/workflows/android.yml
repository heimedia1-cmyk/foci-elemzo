# MexiVerse Android app – két, egymástól teljesen elkülönített csatorna:
#
#   TESZT  (hu.mexiverse.app.teszt, „MexiVerse TESZT”)
#     • automatikusan épül minden push-nál a "mexiverse-dev" ágon
#     • frissítései a test/ mappába kerülnek – az éles app ezt SOHA nem olvassa
#
#   ÉLES   (hu.mexiverse.app, „MexiVerse”)
#     • CSAK tudatos kiadással: kézzel (Actions → Run workflow → channel: stable a mexiverse ágon),
#       vagy a "mexiverse-release" ágra küldött kiadással, ami PONTOSAN az éles mexiverse ág csúcsa lehet.
#       Tesztfejlesztésből (mexiverse-dev) nem lehet éles frissítés.
#     • frissítései a stable/ mappába kerülnek
#
# Frissítőcsomagok: verziózott fájlnevek (soha nem íródnak felül), SHA-256 ellenőrzőösszeg,
# csatornánként az utolsó 3 marad meg. Minden a "mexiverse-apk" ágon tárolódik.
name: Android APK
on:
  workflow_dispatch:
    inputs:
      channel: { description: 'test vagy stable (stable csak a mexiverse ágról!)', default: 'test', required: true }
  push:
    branches: [mexiverse-dev, mexiverse-release]
    paths: ['android/**', 'public/**', 'scripts/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency: { group: android-apk, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event.inputs.channel || (github.ref_name == 'mexiverse-release' && 'stable') || 'test' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.2.${{ github.run_number }}
      BUNDLE_VERSION: b${{ github.run_number }}
    steps:
      - name: Csatorna-őr
        run: |
          if [ "$CHANNEL" != "test" ] && [ "$CHANNEL" != "stable" ]; then echo "Ismeretlen csatorna: $CHANNEL"; exit 1; fi
          if [ "$CHANNEL" = "stable" ]; then
            case "$GITHUB_EVENT_NAME:$GITHUB_REF_NAME" in
              workflow_dispatch:mexiverse) ;;
              push:mexiverse-release)
                LIVE=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/mexiverse | cut -f1)
                if [ "$LIVE" != "$GITHUB_SHA" ]; then echo "A kiadás ($GITHUB_SHA) nem az éles mexiverse ág csúcsa ($LIVE) – megszakítva"; exit 1; fi ;;
              *) echo "Éles build csak kézi indítással vagy mexiverse-release kiadással: $GITHUB_EVENT_NAME:$GITHUB_REF_NAME"; exit 1 ;;
            esac
          fi
          if [ "$CHANNEL" = "test" ] && [ "$GITHUB_REF_NAME" = "mexiverse-release" ]; then exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: mexiverse-debug-keystore-v1 }
      - run: npm ci
      - run: npm test
      - name: Mobil build (helyi játékfájlok)
        run: node scripts/build-mobile.mjs --api https://mexiverse.up.railway.app --channel "$CHANNEL"
      - name: Változat beállítása
        run: |
          if [ "$CHANNEL" = "stable" ]; then echo "APP_ID=hu.mexiverse.app" >> $GITHUB_ENV; echo "APK_NAME=MexiVerse.apk" >> $GITHUB_ENV;
          else echo "APP_ID=hu.mexiverse.app.teszt" >> $GITHUB_ENV; echo "APK_NAME=MexiVerse-teszt.apk" >> $GITHUB_ENV;
            sed -i 's#<string name="app_name">MexiVerse</string>#<string name="app_name">MexiVerse TESZT</string>#' android/app/src/main/res/values/strings.xml; fi
      - run: npx cap sync android
      - name: APK építése
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with: { name: '${{ env.APK_NAME }}', path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Kiadás a csatornára (APK + verziózott frissítőcsomag + ellenőrzőösszeg)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -e
          mkdir out && cd out
          git init -q -b mexiverse-apk
          git config user.name "mexiverse-bot"; git config user.email "mexiverse-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 "$REMOTE" mexiverse-apk && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          mkdir -p "$CHANNEL/bundles"
          cp ../android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          BUNDLE="$CHANNEL/bundles/$BUNDLE_VERSION.zip"
          if [ -e "$BUNDLE" ]; then echo "A $BUNDLE már létezik – nem írjuk felül"; exit 1; fi
          (cd ../mobile-dist && zip -qrX "../out/$BUNDLE" .)
          SHA=$(sha256sum "$BUNDLE" | cut -d' ' -f1); SIZE=$(stat -c%s "$BUNDLE")
          NATIVE=$(grep -o 'const NATIVE = [0-9]*' ../scripts/build-mobile.mjs | grep -o '[0-9]*$')
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mexiverse-apk/$BUNDLE"
          printf '{"channel":"%s","version":"%s","url":"%s","checksum":"%s","size":%s,"minNative":%s,"commit":"%s"}\n' "$CHANNEL" "$BUNDLE_VERSION" "$URL" "$SHA" "$SIZE" "$NATIVE" "${GITHUB_SHA::7}" > "$CHANNEL/version.json"
          # régi (csatorna nélküli) teszt-appok kompatibilitása: a gyökér version.json CSAK a teszt csatornát követi
          if [ "$CHANNEL" = "test" ]; then cp "$CHANNEL/version.json" version.json; fi
          rm -f bundle.zip
          # csatornánként az utolsó 3 csomag marad
          ls -1t "$CHANNEL"/bundles/*.zip | tail -n +4 | xargs -r rm -f
          git add -A && git commit -qm "$CHANNEL $BUNDLE_VERSION ($VERSION_NAME, ${GITHUB_SHA::7})"
          git push -f "$REMOTE" HEAD:mexiverse-apk
      - name: Hibanapló közzététele (csak hiba esetén)
        if: failure()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          mkdir logout && cd logout && git init -q -b mexiverse-buildlog
          git config user.name "mexiverse-bot"; git config user.email "mexiverse-bot@users.noreply.github.com"
          tail -c 60000 ../gradle-build.log > build.log 2>/dev/null || echo "nincs napló" > build.log
          git add -A && git commit -qm "build log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:mexiverse-buildlog
